name: Inspect retained load validity diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/load-matrix-20261026
      - uses: actions/download-artifact@v4
        with:
          name: controlled-scifact-load-evidence
          run-id: 40387499975
          github-token: ${{ github.token }}
          path: retained
      - name: Inspect invalid observations and preserve the exact failed collection
        run: |
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          for path in sorted(Path("retained").glob("first-*.json.gz")):
              row = json.loads(gzip.decompress(path.read_bytes()))
              print(json.dumps({"file": path.name, "status": row["observation_status"],
                                "invalid_reason": row.get("invalid_reason"),
                                "restart": row.get("restart_observation"),
                                "snapshots": row.get("process_snapshots")}, sort_keys=True))
          PY
          target="benchmarks/service/results/load/2026-10-26-invalid-40387499975"
          mkdir -p "$target"
          cp -R retained/. "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$target"
          git commit -m "bench: preserve invalid first-search observations for diagnosis"
          git push origin HEAD:refs/heads/p1/load-matrix-20261026
