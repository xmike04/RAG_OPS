groups:
  - name: ragops-api
    rules:
      - alert: RAGOpsAPIDown
        expr: up{job="ragops-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RAGOps API metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the RAGOps API for two minutes.

      - alert: RAGOpsHighHTTPErrorRate
        expr: |
          (
            sum(rate(ragops_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ragops_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAGOps API error rate exceeds 5%
          description: More than 5% of API responses have been 5xx errors for ten minutes.

      - alert: RAGOpsHighQueryLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(ragops_http_request_duration_seconds_bucket{route="/v1/query"}[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAGOps query p95 latency exceeds two seconds
          description: The p95 latency for /v1/query has exceeded two seconds for ten minutes.

